<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
function jump(n){
    if(n==1){
        return 1;
    }else if(n==2){
        return 2;
    }else{
        return jump(n-1)+jump(n-2);
    }
}
for(var i =1;i<38;i++){
    document.write(jump(i),'<br>')
}

    </script>
</body>
</html>
