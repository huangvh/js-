<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>判断素数</title>
</head>
<body>
    <script>
        var n=23
        for(var i=2;i<n-1;i++){
            if(n%i==0){
                break;
            }
        }
        if(i<=n-1){
            document.write(n,"不是素数")
        }else{

            document.write(n,"是素数")
        }
    </script>
</body>
</html>
