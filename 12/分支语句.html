<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
	</head>
	<body>
		<script>
			var date = new Date();
			document.write(date,'<br>')
		var hour = date.getHours();
		var hour = 4;
		document.write(hour,'<br>')
		if(hour>6&&hour<10){
			document.write("早上好",'<br>')
		}else if(hour>11&&hour<18){
			document.write("中午好",'<br>')
			
		}else if(hour>18&&hour<24){
			document.write("晚上好",'<br>')
		}else{
			document.write("夜深了,早点休息",'<br>')
		}
		document.write(
		hour>6&&hour<10 ?"早上好":
		hour>11&&hour<18? "中午好":
		hour>18&&hour<24? "晚上好":
		"夜深了,早点休息",'<br>'
		)
		</script>
	</body>
</html>
