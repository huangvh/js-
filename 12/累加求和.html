<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>累加求和</title>
</head>
<body>
    <script>
        var term ,sum=0
        for(var i=0;i<100;i++){
            if(i%2==0){
                term=-1/i
            }else{
                term=1/i

            }
            sum+=term
            document.write("第",i,"项",term,"<br>")
        }
        document.write("总和"+sum)
    </script>
</body>
</html>
