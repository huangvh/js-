<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .bt{
        height: 28px;
        width: 50px;
        font-size: 15px;
        margin: 5px;
    }
</style>
<body>
    <form action="" method="post" name="myform" id="myform">
        <p>
            第一个数<input type="text" name="num1" id="num1" size="
            25" value="55"/><br>
            第二个数<input type="text" name="num2" id="num2" size="
            25" />
        </p>
        <p>
            <input type="button" name="addButton" value="+" class="bt" onclick="compute('+')">
            <input type="button" name="subButton" value="-" class="bt" onclick="compute('-')">
            <input type="button" name="mulButton" value="*" class="bt" onclick="compute('*')">
            <input type="button" name="divButton" value="/" class="bt" onclick="compute('/')">

        </p>

        <p>
            计算结果<input type="text" name="result" id="result" size="25">
        </p>


    </form>
</body>
<script>
    function compute(op){
        var num1 = document.myform.num1.value-0;
        var num2 = document.myform.num2.value-1;
        if(op=="+"){
            document.myform.result.value=num1 + num2;
        }
           if(op=="-"){
            document.myform.result.value=num1 - num2;
        }
           if(op=="*"){
            document.myform.result.value=num1 * num2;
        }
           if(op=="/"){
            document.myform.result.value=num1 / num2;
        }
        else{
            document.myform.result.value="除数不能为0";
           }
    }
</script>
</html>
