<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
		<style>
			body{
				background-color: aqua;
			}
			table{
				width: 80%;
				height: 300px;
				/* 表格不分开 */
				border-collapse: collapse;
			}
			td{
				border: 1px solid black;
				background-color: white;
				/* 内边距 */
				padding: 6px;
				/* 字体居中对齐 */
				text-align: center;
			}
		</style>
	</head>
	<body>
		<h3>九九乘法表</h3>
		<table>
			<tr>
				<td>1*1=1</td>
			</tr>
			<tr>
				<td>2*1=2</td>
				<td>2*2=4</td>
			</tr>
			<tr>
				<td>3*1=3</td>
				<td>3*2=6</td>
				<td>3*3=9</td>
			</tr>
			<tr>
				<td>4*1=4</td>
				<td>4*2=8</td>
				<td>4*3=12</td>
				<td>4*4=16</td>
			</tr>
			<tr>
				<td>5*1=5 </td>
				<td>5*2=10</td>
				<td>5*3=15</td>
				<td>5*4=20</td>
				<td>5*5=25</td>
			</tr>
		</table>
	</body>
</html>
