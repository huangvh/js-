<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <script>
       	for(var i = 1;i<=9;i++){//i表示行号
					document.write("<tr>");
					for(var j = 1;j <= i;j++){
						document.write("<td>");
						document.write(i,"*",j,"=",i*j);
						document.write("</td>");
					}
					document.write("</tr>");
				}
        </script>
    </table>
</body>
</html>
