<script>
    function fac(n){
        if(n==1 ||n==2){
            return 1;
        }else{
            return fac(n-1)+fac(n-2);
        }
    }
    for(var i=1;i<38;i++){
        document.write(fac(i),"<br>")
    }
</script>
