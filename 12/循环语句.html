<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
	</head>
	<body>
		<script>
			document.write("whlic循环<br>")
			var i = 0;
			while( i < 5){
				document.write(i);
				i++;
			}
			document.write("<br>")
			for(i=0;i<=10;i++){
				document.write(i);
			}
			document.write("<br>")
			i =0;
			do{
				document.write(i);
				i++;
			}while(i<15)
			document.write("<br>")
			var arr=["apple","orange","banana"];
			console.log(arr)
			for(i=0;i<arr.length;i++){
				document.write(i,arr[i]);
			}
			document.write("<br>")
			for(var j in arr){
				document.write(j,arr[j]);
			}
		</script>
	</body>
</html>
