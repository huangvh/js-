<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <script>
        for(var i=2000;i<2500;i++){
            if(i%4 == 0){
                document.write(i,"年是闰年","<br>")
            }else if(i%400==0){
                document.write(i,"年是闰年","<br>")
            }else{
                document.write(i,"不是闰年","<br>")
            }
        }
    </script>
</body>
