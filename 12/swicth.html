<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
	</head>
	<body>
		
		<script>
			var date = new Date().getDate();
			document.write(date,'<br>')
			switch(date){
				case 0:
				document.write("周日<br>")
				break;
				case 1:
				document.write("周一<br>")
				break;
				case 2:
				document.write("周二<br>")
				break;
				case 3:
				document.write("周三<br>")
				break;
				case 4:
				document.write("周四<br>")
				break;
				case 5:
				document.write("周五<br>")
				break;
				case 6:
				document.write("周六<br>")
				break;	
				}
		</script>
	</body>
</html>
